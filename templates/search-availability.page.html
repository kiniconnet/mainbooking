{{template "base" .}}

{{define "css"}}
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.1.2/dist/css/datepicker.min.css">

    <style>
        
/* Custom styles for this page */
.card {
    border-radius: 1rem;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
}

.form-floating {
    position: relative;
}

.form-floating.is-focused label {
    color: var(--bs-primary);
    transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
}

.form-control {
    border-radius: 0.5rem;
    padding: 1rem 1.25rem;
    border: 1px solid #dee2e6;
    transition: all 0.2s ease;
}

.form-control:focus {
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
    border-color: var(--bs-primary);
}

.btn-primary {
    background-color: var(--bs-primary);
    border: none;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
}

/* Responsive adjustments */
@media (max-width: 767.98px) {
    .card {
        border-radius: 0.75rem;
    }
    
    .form-control {
        padding: 0.75rem 1rem;
    }
}

    </style>
{{end}}

{{define "content"}}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-5">
                        <h1 class="display-5 fw-bold text-primary mb-3">Find Your Perfect Stay</h1>
                        <p class="lead text-muted">Check availability for our luxurious accommodations</p>
                    </div>

                    <form action="/search-availability" method="post" novalidate class="needs-validation">
                        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input required class="form-control" type="text" name="start" id="start-date" placeholder="Arrival" autocomplete="off">
                                    <label for="start-date" class="form-label">
                                        <i class="fas fa-calendar-alt me-2"></i>Arrival Date
                                    </label>
                                    <div class="invalid-feedback">Please select an arrival date</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input required class="form-control" type="text" name="end" id="end-date" placeholder="Departure" autocomplete="off">
                                    <label for="end-date" class="form-label">
                                        <i class="fas fa-calendar-alt me-2"></i>Departure Date
                                    </label>
                                    <div class="invalid-feedback">Please select a departure date</div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg py-3">
                                <i class="fas fa-search me-2"></i>Check Availability
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{{end}}

{{define "js"}}
<script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.1.2/dist/js/datepicker-full.min.js"></script>
<script>

document.addEventListener('DOMContentLoaded', function() {
    // Initialize start date picker
    const startDatePicker = new Datepicker(document.getElementById('start-date'), {
        format: "yyyy-mm-dd",
        minDate: new Date(),
        autohide: true,
        orientation: "bottom",
        todayHighlight: true,
        clearBtn: true,
        beforeShowDay: function(date) {
            return {
                enabled: date >= new Date()
            };
        }
    });

    // Initialize end date picker
    const endDatePicker = new Datepicker(document.getElementById('end-date'), {
        format: "yyyy-mm-dd",
        minDate: new Date(),
        autohide: true,
        orientation: "bottom",
        todayHighlight: true,
        clearBtn: true,
        beforeShowDay: function(date) {
            return {
                enabled: date >= new Date()
            };
        }
    });

    // Add modern input interactions
    [startDatePicker.inputField, endDatePicker.inputField].forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.classList.add('is-focused');
        });

        input.addEventListener('blur', function() {
            this.parentElement.classList.remove('is-focused');
        });
    });

    // Form validation feedback
    const form = document.querySelector('.needs-validation');
    form.addEventListener('submit', function(event) {
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();

            if (!startDatePicker.inputField.value) {
                startDatePicker.inputField.parentElement.querySelector('.invalid-feedback').textContent = 'Please select an arrival date';
            }
            if (!endDatePicker.inputField.value) {
                endDatePicker.inputField.parentElement.querySelector('.invalid-feedback').textContent = 'Please select a departure date';
            }
        }
        form.classList.add('was-validated');
    }, false);

    // Add subtle animations
    const card = document.querySelector('.card');
    if (card) {
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        card.style.transition = 'all 0.4s ease-out';

        setTimeout(() => {
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
        }, 100);
    }
});

</script>
{{end}}
